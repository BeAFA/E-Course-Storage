<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/bs-brain@2.0.4/components/registrations/registration-6/assets/css/registration-6.css"
    >
</head>

<body>

<section class="bg-primary p-3 p-md-4 p-xl-5">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-9 col-lg-7 col-xl-6 col-xxl-5">

                <div class="card border-0 shadow-sm rounded-4">

                    <div class="card-body p-3 p-md-4 p-xl-5">

                        <!-- Header -->
                        <div class="row">
                            <div class="col-12">

                                <div class="mb-5">

                                    <h2 class="h3">
                                        Sign in
                                    </h2>

                                    <h3 class="fs-6 fw-normal text-secondary m-0">
                                        Enter your username and password
                                    </h3>

                                </div>

                            </div>
                        </div>


                        <!-- Flash message -->
                        {% with messages = get_flashed_messages(with_categories=true) %}

                            {% if messages %}

                                {% for category, message in messages %}

                                    <div class="alert alert-{{ category }}">
                                        {{ message }}
                                    </div>

                                {% endfor %}

                            {% endif %}

                        {% endwith %}


                        <!-- Login form -->
                        <form action="{{ url_for('login') }}" method="POST">

                            <div class="row gy-3 overflow-hidden">

                                <!-- Username -->
                                <div class="col-12">

                                    <div class="form-floating mb-3">

                                        <input
                                            type="text"
                                            class="form-control"
                                            name="username"
                                            id="username"
                                            placeholder="Username"
                                            required
                                            autofocus
                                        >

                                        <label for="username">
                                            Username
                                        </label>

                                    </div>

                                </div>


                                <!-- Password -->
                                <div class="col-12">

                                    <div class="form-floating mb-3">

                                        <input
                                            type="password"
                                            class="form-control"
                                            name="password"
                                            id="password"
                                            placeholder="Password"
                                            required
                                        >

                                        <label for="password">
                                            Password
                                        </label>

                                    </div>

                                </div>


                                <!-- Remember me -->
                                <div class="col-12">

                                    <div class="form-check">

                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            name="remember"
                                            id="remember"
                                        >

                                        <label
                                            class="form-check-label text-secondary"
                                            for="remember"
                                        >
                                            Remember me
                                        </label>

                                    </div>

                                </div>


                                <!-- Submit -->
                                <div class="col-12">

                                    <div class="d-grid">

                                        <button
                                            class="btn bsb-btn-2xl btn-primary"
                                            type="submit"
                                        >
                                            Sign in
                                        </button>

                                    </div>

                                </div>

                            </div>

                        </form>


                        <!-- Test accounts -->
                        <div class="mt-5">

                            <hr>

                            <p class="text-secondary mb-2">
                                Test accounts:
                            </p>

                            <small class="text-secondary">
                                admin / Admin@123
                            </small>

                            <br>

                            <small class="text-secondary">
                                testuser / Test@123
                            </small>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
</section>

</body>
</html>
